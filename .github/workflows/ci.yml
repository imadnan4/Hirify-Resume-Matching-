name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, empty-base]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:///test.db
          EMBEDDING_BACKEND: hash
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check frontend exists
        id: check
        run: |
          if [ -f frontend/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm ci

      - name: Type check
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm run build
